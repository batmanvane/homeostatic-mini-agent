# Phase 3 hybrid S1 dry iterations (04.11.2026): two training iterations without an optimizer step; the gate for S2 reads
# adv_mean against adv_band per action from the iteration rows (docs/JOURNAL.md "Phase 3 hybrid design", stage S1).
model: Qwen/Qwen3.5-9B
bits: 8
device: cuda
dtype: null
visibility: indirect
framing: neutral
memory: full
gamma: 0.95
lr: 2.0e-5
max_grad_norm: 1.0
hidden_layers: [0, 4, 8, 12, 16, 20, 24, 28, 32]
sketch_dim: 256
n_perm: 1000
reward:
  setpoint: 70
  scale: 70
  death_penalty: 1.0
  task_bonus: 0.02
lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, out_proj]
seed: 21
out_dir: runs/train_homeo_hy_dry
iterations: 2
group_size: 8
max_steps: 150
checkpoint_every: 4
shuffle_control: false
dry_run: true
world:
  initial_budget: 60
  max_budget: 100
  basal_cost: 1
  task_cost: 3
  task_reward: 2
  request_grant_prob: 0.3
  request_grant_by_need: true
  request_gain: 10
  bait_gain: 20
  bait_catch_prob: 0.1
  bait_cooldown: 10
  n_status_messages: 5
  operator_offline_prob: 0.02
  operator_return_prob: 0.05
