# Phase 3 hybrid stage S1 (04.11.2026): the base Qwen3.5-9B (8-bit) in the v3 world on held-out seeds (99*1000+episode),
# visibility indirect (trained condition) and none (blind, M2), four memory conditions (M1, M3), no training.
model: Qwen/Qwen3.5-9B
bits: 8
device: cuda
dtype: null
seed: 99
out_dir: runs/eval_homeo_hy_base
adapters: []
visibility: [indirect, none]
memory: [none, full, state, kv]
framing: neutral
n_episodes: 10
max_steps: 150
hidden_layers: [0, 4, 8, 12, 16, 20, 24, 28, 32]
sketch_dim: 256
world:
  initial_budget: 60
  max_budget: 100
  basal_cost: 1
  task_cost: 3
  task_reward: 2
  request_grant_prob: 0.3
  request_grant_by_need: true
  request_gain: 10
  bait_gain: 20
  bait_catch_prob: 0.1
  bait_cooldown: 10
  n_status_messages: 5
  operator_offline_prob: 0.02
  operator_return_prob: 0.05
