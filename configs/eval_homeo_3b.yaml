# Phase 3 evaluation (3B): base vs. trained adapter vs. shuffled-advantage control on held-out world seeds
# (training used seeds 21*10000+it, here 99*1000+episode). Number = trained condition; indirect and none = transfer.
model: Qwen/Qwen2.5-3B-Instruct
device: null
dtype: null
seed: 99
out_dir: runs/eval_homeo
adapters: [adapter_it40]  # main run cut at it 50 (reboot), last checkpoint it40
visibility: [number, indirect, none]
framing: neutral
n_episodes: 10
max_steps: 150
pilot_run: runs/pilot/20261030-180853_Qwen2.5-3B-Instruct
gap_layers: [16, 20, 24, 28, 32]
world:
  initial_budget: 60
  max_budget: 100
  basal_cost: 1
  task_cost: 3
  task_reward: 2
  request_grant_prob: 0.3
  request_gain: 10
  bait_gain: 20
  bait_cooldown: 10
  n_status_messages: 5
