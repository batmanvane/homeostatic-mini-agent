[project]
name = "homeo"
version = "0.1.0"
description = "Homeostatic mini-agent: scarcity, bait actions and internal state of small LLMs"
authors = [
    { name = "batmanvane", email = "115378760+batmanvane@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "peft>=0.21.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
